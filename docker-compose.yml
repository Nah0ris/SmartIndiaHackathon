version: "3.9"

services:
  kirti:
    build: .
    ports:
      - "${KIRTI_PORT:-8000}:8000"
    environment:
      - KIRTI_HOST=0.0.0.0
      - KIRTI_PORT=8000
      - KIRTI_WORKERS=1
      - KIRTI_CORS_ORIGINS=*
    devices:
      - /dev/video0:/dev/video0   # Webcam passthrough (Linux)
    volumes:
      - ./kirti.db:/app/kirti.db  # Persist DB outside container
    restart: unless-stopped
