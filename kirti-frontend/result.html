<link rel="stylesheet" href="style.css">

<div class="container">

    <header class="results-header">
        <h1>Athlete Results</h1>
        <p>Fitness Testing Performance Report</p>
    </header>

    <div class="results-card">

        <table class="results-table">

            <thead>
                <tr>
                    <th>Athlete</th>
                    <th>Test</th>
                    <th>Score</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="results-body">
                <tr>
                    <td colspan="5">Loading result...</td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script>
const API_BASE = "http://localhost:8000";

const params = new URLSearchParams(window.location.search);

const athleteId = params.get("athlete");
const testType = params.get("test") || "situp";

async function loadResult() {
    try {

        // Get athlete information
        const athletesResponse =
            await fetch(`${API_BASE}/api/athletes`);

        if (!athletesResponse.ok) {
            throw new Error("Failed to load athletes");
        }

        const athletes = await athletesResponse.json();

        const athlete = athletes.find(
            a => a.id === athleteId
        );

        // Get session result
        const statusResponse =
            await fetch(`${API_BASE}/api/session/status`);

        if (!statusResponse.ok) {
            throw new Error("Failed to load session result");
        }

        const status = await statusResponse.json();

        let score;
        let testName;
        let unit;

        if (testType === "situp") {
            score = status.rep_count || 0;
            testName = "Sit-ups";
            unit = "reps";
        } else {
            score = status.jump_height_cm || 0;
            testName = "Vertical Jump";
            unit = "cm";
        }

        const athleteName =
            athlete ? athlete.name : "Unknown Athlete";

        const today = new Date().toLocaleDateString("en-GB");

        document.getElementById("results-body").innerHTML = `
            <tr>
                <td>${athleteName}</td>
                <td>${testName}</td>
                <td>${score} ${unit}</td>
                <td>${today}</td>
                <td>
                    <span class="status-pass">Completed</span>
                </td>
            </tr>
        `;

    } catch (error) {

        console.error("Error loading result:", error);

        document.getElementById("results-body").innerHTML = `
            <tr>
                <td colspan="5">
                    Unable to load result.
                </td>
            </tr>
        `;
    }
}

loadResult();
</script>
