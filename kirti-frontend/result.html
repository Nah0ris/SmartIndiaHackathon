<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Results</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="results-header">
            <h1>Athlete Results</h1>
            <p>Fitness Testing Performance Report</p>
        </header>


        <!-- Results Table -->
        <div class="results-card">

            <table class="results-table">

                <thead>
                    <tr>
                        <th>Athlete</th>
                        <th>Test</th>
                        <th>Score</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>


                <tbody>

                    <tr>
                        <td>Rahul Kumar</td>
                        <td>Vertical Jump</td>
                        <td>78 cm</td>
                        <td>07-08-2026</td>
                        <td>
                            <span class="status-pass">Passed</span>
                        </td>
                    </tr>


                    <tr>
                        <td>Priya Sharma</td>
                        <td>Sprint Test</td>
                        <td>9.8 sec</td>
                        <td>07-08-2026</td>
                        <td>
                            <span class="status-fail">Failed</span>
                        </td>
                    </tr>


                    <tr>
                        <td>Arjun Patel</td>
                        <td>Push Ups</td>
                        <td>45 reps</td>
                        <td>07-08-2026</td>
                        <td>
                            <span class="status-pass">Passed</span>
                        </td>
                    </tr>


                    <tr>
                        <td>Sneha Das</td>
                        <td>Agility Test</td>
                        <td>82 points</td>
                        <td>07-08-2026</td>
                        <td>
                            <span class="status-pass">Passed</span>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</body>

</html>
