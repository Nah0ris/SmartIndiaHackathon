<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Test</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <main class="max-w-4xl mx-auto px-6 py-10">

        <h1 class="text-4xl font-bold mb-2">
            Select Test
        </h1>

        <p id="athlete-info" class="text-gray-600 mb-8">
            Loading athlete...
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <button
                onclick="startTest('situp')"
                class="bg-white rounded-xl shadow-md p-8 text-left hover:shadow-xl transition"
            >
                <h2 class="text-2xl font-bold mb-2">
                    Sit-ups
                </h2>

                <p class="text-gray-600">
                    Perform as many sit-ups as possible.
                </p>
            </button>

            <button
                onclick="startTest('vertical_jump')"
                class="bg-white rounded-xl shadow-md p-8 text-left hover:shadow-xl transition"
            >
                <h2 class="text-2xl font-bold mb-2">
                    Vertical Jump
                </h2>

                <p class="text-gray-600">
                    Measure your vertical jump.
                </p>
            </button>

        </div>

    </main>

    <script>

        // Get the athlete ID from the URL
        // Example: test.html?athlete=123

        const params = new URLSearchParams(window.location.search);
        const athleteId = params.get("athlete");

        document.getElementById("athlete-info").textContent =
            `Selected Athlete ID: ${athleteId}`;


        function startTest(testType) {

            window.location.href =
                `../kirti-frontend/session.html?athlete=${athleteId}&test=${testType}`;
        }          

    </script>

</body>
</html>
